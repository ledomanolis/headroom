# Publishes the site to GitHub Pages, and refreshes the market data every weekday morning.
#   - push to main: deploy the site as it is
#   - schedule / manual run: refresh Bank of England and ONS data, commit it, then deploy
name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1-5'   # 07:30 UTC, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-data:
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest market data
        # The Bank of England's server is sometimes unreliable; if it fails, deploy the saved data.
        continue-on-error: true
        shell: powershell
        run: ./tools/update-market-data.ps1
      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh market data" && git push)

  deploy:
    needs: refresh-data
    # Run after a refresh, or on its own for a push (when refresh-data is skipped).
    if: always() && (needs.refresh-data.result == 'success' || needs.refresh-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html css js data templates _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
